<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Descubre los mejores zapatosen 2025">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="estiloPrincipal.css">
    <title>Landing page</title>
</head>
<body>
    <header>
        <h1>MANACO</h1>
        <nav>
            <a href="#" tabindex="2">Inicio</a>&nbsp;
            <a href="#" tabindex="3">Servicios</a>&nbsp;
            <a href="#" tabindex="4">Contacto</a>&nbsp;
        </nav>
    </header>
    <main>
        <section class="banner">
            <span>Calzado que impulsa tu paso</span>
        </section>
        <h1>Productos</h1>
        <section class="container">
                <article class="producto">
                    <img src="manaco1.jpg" alt="producto 1"><br>
                    <span>producto 1 <br><div id="precio 1">$00.00</div></span>
                    <button tabindex="-1" aria-label="añadiendo al carrito de compras" aria-describedby="precio1">Comprar</button>
                </article>
                <article class="producto">
                    <img src="manaco2.jpg" alt="producto 2"><br>
                    <span>producto 2 <br><div id="precio 2">$00.00</div></span>
                    <button tabindex="0" aria-label="añadiendo al carrito de compras" aria-describedby="precio2">Comprar</button>
                </article>
                <article class="producto">
                    <img src="manaco3.jpg" alt="producto 3"><br>
                    <span>producto 3 <br><div id="precio 3">$00.00</div></span>
                    <button tabindex="1" aria-label="añadiendo al carrito de compras" aria-describedby="precio3">Comprar</button>
                </article>
        </section>
    </main>
    <footer>
        <p>Copyright 2025 MANACO</p>
    </footer>
</body>
</html>
